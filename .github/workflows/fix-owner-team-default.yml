name: Fix Owner Team Assignment Default
on:
  push:
    paths:
      - '.github/workflows/fix-owner-team-default.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove fake default team assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/owner/OwnerDashboard.tsx')
          s = p.read_text()
          old = "const [agTeamId, setAgTeamId] = useState('team-1');"
          new = "const [agTeamId, setAgTeamId] = useState('');"
          if old not in s:
              raise SystemExit('Expected fake team default not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify
        run: |
          ! grep -n "agTeamId.*useState('team-1')" src/components/owner/OwnerDashboard.tsx
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/owner/OwnerDashboard.tsx
          git commit -m 'fix: remove fake owner team assignment default' || exit 0
          git push
