name: Cleanup Fake Identity Data

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove fake identity fallbacks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              "'199518294021'": "''",
              '"199518294021"': '""',
              "'951829402V'": "''",
              '"951829402V"': '""',
              "'0771234567'": "''",
              '"0771234567"': '""',
              "|| 'AG-000'": "|| ''",
              '|| "AG-000"': '|| ""',
              "|| 'Team Alpha'": "|| 'Not Assigned'",
              '|| "Team Alpha"': '|| "Not Assigned"',
              "|| 'Alpha Team'": "|| 'Not Assigned'",
              '|| "Alpha Team"': '|| "Not Assigned"',
              "|| 'DD World Agent'": "|| 'Not Available'",
              '|| "DD World Agent"': '|| "Not Available"',
              "|| 'DD World Team'": "|| 'Not Assigned'",
              '|| "DD World Team"': '|| "Not Assigned"',
              "|| 'No. 124, Kandy Road, Kadawatha, Sri Lanka'": "|| ''",
              "|| 'Sri Lanka'": "|| ''",
          }

          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                  continue
              if path.as_posix().endswith('src/data/initialData.ts'):
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate runtime fallback cleanup
        shell: bash
        run: |
          if grep -RInE "199518294021|951829402V|0771234567|\|\|[[:space:]]*['\"]AG-000['\"]|\|\|[[:space:]]*['\"]Team Alpha['\"]|\|\|[[:space:]]*['\"]Alpha Team['\"]|\|\|[[:space:]]*['\"]DD World Agent['\"]|\|\|[[:space:]]*['\"]DD World Team['\"]|\|\|[[:space:]]*['\"]No\. 124, Kandy Road, Kadawatha, Sri Lanka['\"]|\|\|[[:space:]]*['\"]Sri Lanka['\"]" src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --exclude='initialData.ts'; then
            echo "Runtime fake identity fallback remains."
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fake identity fallbacks found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: remove fake identity data fallbacks"
          git push
