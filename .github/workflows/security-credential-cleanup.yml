name: Security Credential Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'src/data/initialData.ts'
      - 'src/components/owner/OwnerDashboard.tsx'
      - 'src/types.ts'
      - '.github/workflows/security-credential-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'security: remove legacy hardcoded credentials'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove legacy credential fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          initial = Path('src/data/initialData.ts')
          text = initial.read_text()
          text = re.sub(r'^\s*(?:password|pinCode|tempPassword)\s*:\s*[^,\n]+,\s*\n', '', text, flags=re.M)
          initial.write_text(text)

          owner = Path('src/components/owner/OwnerDashboard.tsx')
          text = owner.read_text()
          text = re.sub(r'^\s*const \[agTempPassword, setAgTempPassword\] = useState\([^\n]*\);\s*\n', '', text, flags=re.M)
          text = re.sub(r'^\s*tempPassword\s*:\s*agTempPassword,\s*\n', '', text, flags=re.M)
          text = re.sub(r'\n?\s*<input(?:(?!</?input)[\s\S])*?value=\{agTempPassword\}(?:(?!</?input)[\s\S])*?/>(?:\n)?', '\n', text)
          text = re.sub(r'^.*(?:agTempPassword|setAgTempPassword).*$\n?', '', text, flags=re.M)
          owner.write_text(text)
          PY

      - name: Verify no legacy credential fields remain in application source
        run: |
          if grep -RInE --include='*.ts' --include='*.tsx' '\b(password|pinCode|tempPassword)\s*:' src; then
            echo 'Legacy credential field remains in source.'
            exit 1
          fi
          if grep -RInE --include='*.ts' --include='*.tsx' 'targetUser\.(password|pinCode|tempPassword)|user\.(password|pinCode|tempPassword)' src; then
            echo 'Legacy credential read remains in source.'
            exit 1
          fi

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git add src/data/initialData.ts src/components/owner/OwnerDashboard.tsx
          git commit -m 'security: remove legacy hardcoded credentials'
          git push
