name: Apply Field App Activation Patch

on:
  push:
    paths:
      - '.github/field-app-activation-patch'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: remove temporary field app activation patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch customer app activation flow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/sales/IvrKeypadAndAppShareModal.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "  const [appShareSuccess, setAppShareSuccess] = useState<string | null>(null);",
              "  const [appShareSuccess, setAppShareSuccess] = useState<string | null>(null);\n  const [pendingAppActivation, setPendingAppActivation] = useState<{ app: string; channel: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT'; createdAt: string } | null>(null);"
          )

          pattern = r"  const logAppActivationSale = \(shareChannel: 'WHATSAPP' \| 'SMS' \| 'QR' \| 'DIRECT'\) => \{.*?\n  \};\n\n  const handleShareWhatsApp"
          replacement = '''  const createPendingAppActivation = (shareChannel: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT') => {
    const appName = getAppName();
    const createdAt = new Date().toISOString();
    setPendingAppActivation({ app: appName, channel: shareChannel, createdAt });
    setAppShareSuccess(
      `🟡 ${appName} link එක යවන ලදී. Activation එක තවම Sale ලෙස Count කර නැත.\\nCustomer App එක install/activate කළ පසු පහළ Confirm button එක භාවිතා කරන්න.`
    );
    // Customer phone/name stay only in component memory and are cleared after sharing.
    setAppCustomerPhone('');
    setAppCustomerName('');
  };

  const confirmAppActivationSale = () => {
    if (!pendingAppActivation) {
      alert('මුලින් Customer App link එක share කරන්න.');
      return;
    }

    const productType = selectedApp === 'govimithuru' ? 'ගොවිමිතුරු' : 'සයුරු';
    const productName = `${getAppName()} [Verified Customer Activation]`;
    const lat = currentUser.location?.latitude || 6.9271;
    const lng = currentUser.location?.longitude || 79.8612;
    const district = currentUser.location?.district || currentUser.assignedDistrict || 'Colombo';
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    addProductSale({
      agentId: currentUser.id,
      agentName: currentUser.name,
      agentCode: currentUser.agentCode || 'AG-000',
      teamId: currentUser.teamId || 'team-1',
      productType,
      productName,
      channel: 'APP',
      quantity: 1,
      amount: 0,
      notes: `Customer App activation confirmed by agent | ${pendingAppActivation.channel} | ${pendingAppActivation.createdAt}`,
      location: `${district} (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
      latitude: lat,
      longitude: lng,
      district,
      time: timeStr,
      activationMethod: 'APP_LINK_SHARE',
      appShareChannel: pendingAppActivation.channel,
    });

    setPendingAppActivation(null);
    setAppShareSuccess(`✅ ${productName} Sale එක Count කරන ලදී. Customer phone number එක Sale record එකට save නොකෙරේ.`);
    setTimeout(() => setAppShareSuccess(null), 6000);
  };

  const handleShareWhatsApp'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not find app activation sale function')
          text = new_text

          text = text.replace("    logAppActivationSale('WHATSAPP');", "    createPendingAppActivation('WHATSAPP');")
          text = text.replace("    logAppActivationSale('SMS');", "    createPendingAppActivation('SMS');")
          text = text.replace("    logAppActivationSale('DIRECT');", "    createPendingAppActivation('DIRECT');")

          old_button = '''            {/* DIRECT MANUAL LOG BUTTON */}
            <button
              type="button"
              onClick={() => logAppActivationSale('DIRECT')}
              className="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition flex items-center justify-center gap-2 border border-slate-700"
            >
              <CheckCircle2 className="w-4 h-4 text-emerald-400" />
              <span>පාරිභෝගික දුරකථනයට Download කළ පසු Sale එක Count කරන්න</span>
            </button>'''
          new_button = '''            {/* CUSTOMER ACTIVATION CONFIRMATION */}
            <div className="p-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 space-y-2">
              <div className="text-[11px] text-amber-200 font-bold">
                {pendingAppActivation
                  ? `🟡 Pending: ${pendingAppActivation.app} • ${pendingAppActivation.channel}`
                  : 'Link share කළ පසු Customer App activation එක confirm කරන්න.'}
              </div>
              <button
                type="button"
                onClick={confirmAppActivationSale}
                disabled={!pendingAppActivation}
                className={`w-full py-2.5 px-4 rounded-xl font-black text-xs transition flex items-center justify-center gap-2 border ${
                  pendingAppActivation
                    ? 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500'
                    : 'bg-slate-800 text-slate-500 border-slate-700 cursor-not-allowed'
                }`}
              >
                <CheckCircle2 className="w-4 h-4" />
                <span>Customer Install / Activation OK — Sale Count කරන්න</span>
              </button>
              <p className="text-[10px] text-slate-500">
                Customer mobile/name local storage හෝ Sale record එකට save නොකෙරේ.
              </p>
            </div>'''
          if old_button not in text:
              raise SystemExit('Could not find direct app activation button')
          text = text.replace(old_button, new_button, 1)

          path.write_text(text, encoding='utf-8')

          marker = Path('.github/field-app-activation-patch')
          marker.unlink(missing_ok=True)

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sales/IvrKeypadAndAppShareModal.tsx .github/field-app-activation-patch
          git diff --cached --quiet && exit 0
          git commit -m "feat: separate customer app sharing from verified sales"
          git push
