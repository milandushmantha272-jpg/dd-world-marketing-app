name: Repair GPS Attendance Security

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unsafe attendance handlers
        shell: python
        run: |
          from pathlib import Path
          import re

          specs = [
              (Path('src/components/agent/AgentDashboard.tsx'), 'handleCheckIn', 'handleCheckOut', 'todayAttRecord', 'AG-000'),
              (Path('src/components/leader/TeamLeaderDashboard.tsx'), 'handleTlCheckIn', 'handleTlCheckOut', 'todayTlAttRecord', 'TL-000'),
          ]

          for path, checkin, checkout, today, default_code in specs:
              s = path.read_text(encoding='utf-8')

              checkin_body = f'''  const {checkin} = () => {{
    if ({today}?.checkInTime) {{
      setAttMessage('⚠️ අද දින පැමිණීම (Check-In) දැනටමත් සටහන් කර ඇත.');
      setTimeout(() => setAttMessage(null), 4000);
      return;
    }}
    if (!('geolocation' in navigator)) {{
      setAttMessage('⚠️ මෙම device එකේ GPS support නොමැත. Attendance සුරැකුණේ නැත.');
      setTimeout(() => setAttMessage(null), 5000);
      return;
    }}
    navigator.geolocation.getCurrentPosition(
      (pos) => {{
        const fakeCheck = detectFakeGps(pos.coords);
        if (fakeCheck.isFake) {{
          addSecurityAlert({{
            userId: currentUser.id,
            userName: currentUser.name,
            agentCode: currentUser.agentCode || '{default_code}',
            type: 'GPS_SPOOFING',
            reason: `Mock Location / Fake GPS Detected during Check-In: ${{fakeCheck.reason}}`,
            severity: 'critical',
            coordinates: {{ latitude: pos.coords.latitude, longitude: pos.coords.longitude }},
          }});
          setAttMessage('⚠️ Fake GPS හඳුනාගන්නා ලදී. Check-In අවහිර කරන ලදී.');
          setTimeout(() => setAttMessage(null), 5000);
          return;
        }}
        updateUserGps(currentUser.id, {{ latitude: pos.coords.latitude, longitude: pos.coords.longitude }});
        addAttendanceRecord({{
          agentId: currentUser.id,
          agentName: currentUser.name,
          agentCode: currentUser.agentCode || '{default_code}',
          teamId: currentUser.teamId || 'team-1',
          teamName: currentUser.teamName || 'Team Alpha',
          checkInTime: new Date().toLocaleTimeString([], {{ hour: '2-digit', minute: '2-digit', second: '2-digit' }}),
          status: attStatus,
        }});
        setAttMessage('✅ GPS verify කර Check-In සාර්ථකව සටහන් කරන ලදී.');
        setTimeout(() => setAttMessage(null), 4000);
      }},
      (err) => {{
        console.warn('GPS error during check-in:', err);
        setAttMessage('⚠️ GPS ලබාගත නොහැක. GPS ON කරලා නැවත උත්සාහ කරන්න. Attendance සුරැකුණේ නැත.');
        setTimeout(() => setAttMessage(null), 5000);
      }},
      {{ enableHighAccuracy: true }}
    );
  }};'''

              checkout_body = f'''  const {checkout} = () => {{
    if ({today}?.checkOutTime) {{
      setAttMessage('⚠️ අද දින පිටවීම (Check-Out) දැනටමත් සටහන් කර ඇත.');
      setTimeout(() => setAttMessage(null), 4000);
      return;
    }}
    if (!({today}?.checkInTime)) {{
      setAttMessage('⚠️ මුලින් Check-In සාර්ථකව සටහන් කර තිබිය යුතුය.');
      setTimeout(() => setAttMessage(null), 5000);
      return;
    }}
    if (!('geolocation' in navigator)) {{
      setAttMessage('⚠️ GPS support නොමැත. Check-Out සුරැකුණේ නැත.');
      setTimeout(() => setAttMessage(null), 5000);
      return;
    }}
    navigator.geolocation.getCurrentPosition(
      (pos) => {{
        const fakeCheck = detectFakeGps(pos.coords);
        if (fakeCheck.isFake) {{
          addSecurityAlert({{
            userId: currentUser.id,
            userName: currentUser.name,
            agentCode: currentUser.agentCode || '{default_code}',
            type: 'GPS_SPOOFING',
            reason: `Mock Location / Fake GPS Detected during Check-Out: ${{fakeCheck.reason}}`,
            severity: 'critical',
            coordinates: {{ latitude: pos.coords.latitude, longitude: pos.coords.longitude }},
          }});
          setAttMessage('⚠️ Fake GPS හඳුනාගන්නා ලදී. Check-Out අවහිර කරන ලදී.');
          setTimeout(() => setAttMessage(null), 5000);
          return;
        }}
        updateUserGps(currentUser.id, {{ latitude: pos.coords.latitude, longitude: pos.coords.longitude }});
        addAttendanceRecord({{
          agentId: currentUser.id,
          agentName: currentUser.name,
          agentCode: currentUser.agentCode || '{default_code}',
          teamId: currentUser.teamId || 'team-1',
          teamName: currentUser.teamName || 'Team Alpha',
          checkOutTime: new Date().toLocaleTimeString([], {{ hour: '2-digit', minute: '2-digit', second: '2-digit' }}),
          status: 'completed',
        }});
        setAttMessage('✅ GPS verify කර Check-Out සාර්ථකව සටහන් කරන ලදී.');
        setTimeout(() => setAttMessage(null), 4000);
      }},
      (err) => {{
        console.warn('GPS error during check-out:', err);
        setAttMessage('⚠️ GPS verify කළ නොහැක. Check-Out සුරැකුණේ නැත.');
        setTimeout(() => setAttMessage(null), 5000);
      }},
      {{ enableHighAccuracy: true }}
    );
  }};'''

              s, n1 = re.subn(rf'  const {checkin} = \(\) => \{{[\s\S]*?\n  \}};', checkin_body, s, count=1)
              if n1 != 1:
                  raise SystemExit(f'Check-in handler not found: {path}')

              s, n2 = re.subn(rf'  const {checkout} = \(\) => \{{[\s\S]*?\n  \}};', checkout_body, s, count=1)
              if n2 != 1:
                  raise SystemExit(f'Check-out handler not found: {path}')

              path.write_text(s, encoding='utf-8')

          for path in [p for p, *_ in specs]:
              s = path.read_text(encoding='utf-8')
              if re.search(r'GPS error during check-in:[\s\S]{0,1200}addAttendanceRecord', s):
                  raise SystemExit(f'Unsafe check-in fallback remains: {path}')
              if re.search(r'GPS error during check-out:[\s\S]{0,1200}addAttendanceRecord', s):
                  raise SystemExit(f'Unsafe check-out fallback remains: {path}')
              for name in ('handleCheckOut', 'handleTlCheckOut'):
                  m = re.search(rf'  const {name} = \(\) => \{{[\s\S]*?\n  \}};', s)
                  if m and 'getCurrentPosition' not in m.group(0):
                      raise SystemExit(f'Checkout has no GPS verification: {path}')

          print('GPS attendance security handlers verified.')

      - name: Commit repaired code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/agent/AgentDashboard.tsx src/components/leader/TeamLeaderDashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: require verified GPS for attendance check-in and check-out"
          git push origin HEAD:main
