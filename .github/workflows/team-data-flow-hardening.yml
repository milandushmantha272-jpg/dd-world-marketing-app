name: Harden Owner TL Agent Data Flow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove implicit team/code fallbacks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path('src/components/leader/TeamLeaderDashboard.tsx'),
              Path('src/components/agent/AgentDashboard.tsx'),
              Path('src/components/owner/OwnerDashboard.tsx'),
              Path('src/components/sales/IvrKeypadAndAppShareModal.tsx'),
          ]
          replacements = {
              "currentUser.teamId || 'team-1'": "currentUser.teamId || ''",
              'currentUser.teamId || "team-1"': 'currentUser.teamId || ""',
              "currentUser.agentCode || 'TL-000'": "currentUser.agentCode || ''",
              'currentUser.agentCode || "TL-000"': 'currentUser.agentCode || ""',
              "const [agTeamId, setAgTeamId] = useState('team-1');": "const [agTeamId, setAgTeamId] = useState('');",
          }
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              u = s
              for old, new in replacements.items():
                  u = u.replace(old, new)
              if u != s:
                  p.write_text(u, encoding='utf-8')
          PY

      - name: Verify no implicit role assignment remains
        shell: bash
        run: |
          if grep -RInE "currentUser\.teamId[[:space:]]*\|\|[[:space:]]*['\"]team-1['\"]|currentUser\.agentCode[[:space:]]*\|\|[[:space:]]*['\"]TL-000['\"]|useState\(['\"]team-1['\"]\)" src/components --include='*.ts' --include='*.tsx'; then
            echo 'Implicit runtime team/code fallback remains.'
            exit 1
          fi
          echo 'Owner/TL/Agent runtime team-code fallback audit PASS.'

      - name: Commit hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: remove implicit owner TL agent team assignments'
          git push
