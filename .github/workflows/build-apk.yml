name: Build Permanent Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dd-world-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Security credential cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          initial = Path('src/data/initialData.ts')
          text = initial.read_text()
          text = re.sub(r'^\s*(?:password|pinCode|tempPassword)\s*:\s*[^,\n]+,\s*\n', '', text, flags=re.M)
          initial.write_text(text)

          owner = Path('src/components/owner/OwnerDashboard.tsx')
          text = owner.read_text()
          text = re.sub(r'^\s*const \[agTempPassword, setAgTempPassword\] = useState\([^\n]*\);\s*\n', '', text, flags=re.M)
          text = re.sub(r'^\s*tempPassword\s*:\s*agTempPassword,\s*\n', '', text, flags=re.M)
          text = re.sub(r'\n?\s*<input(?:(?!</?input)[\s\S])*?value=\{agTempPassword\}(?:(?!</?input)[\s\S])*?/>(?:\n)?', '\n', text)
          text = re.sub(r'^.*(?:agTempPassword|setAgTempPassword).*$\n?', '', text, flags=re.M)
          text = re.sub(r'\n  // Owner Custom Password modal state\n[\s\S]*?\n  const \[gpsMapModalOpen, setGpsMapModalOpen\] = useState\(false\);', '\n  const [gpsMapModalOpen, setGpsMapModalOpen] = useState(false);', text, count=1)
          text = re.sub(r'\n  const handleSaveOwnerPassword = \(e: React\.FormEvent\) => \{[\s\S]*?\n  // Website CMS state', '\n  // Website CMS state', text, count=1)
          text = re.sub(r'\n      \{/\* Owner Custom Password Change Modal \*/\}[\s\S]*?\n      \)\}\n', '\n', text, count=1)
          owner.write_text(text)
          PY

          if grep -RInE --include='*.ts' --include='*.tsx' '\b(password|pinCode|tempPassword)\s*:\s*(["'"'"'`]|DDW@|[0-9]{3,})' src/data src/components; then
            echo 'Legacy credential field remains in application source.'
            exit 1
          fi
          if grep -RInE --include='*.ts' --include='*.tsx' 'targetUser\.(password|pinCode|tempPassword)|user\.(password|pinCode|tempPassword)' src; then
            echo 'Legacy credential read remains in application source.'
            exit 1
          fi
          if grep -RInE --include='*.ts' --include='*.tsx' 'agTempPassword|setAgTempPassword|isPwdModalOpen|newOwnerPwd|confirmOwnerPwd|handleSaveOwnerPassword|ddw_custom_owner_password' src; then
            echo 'Legacy password UI logic remains in application source.'
            exit 1
          fi

      - name: Commit credential cleanup to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No credential cleanup changes required.'
          else
            git add src/data/initialData.ts src/components/owner/OwnerDashboard.tsx
            git commit -m 'security: remove legacy hardcoded credentials'
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: TypeScript Check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Production Server Security Guard
        run: |
          test -s server.secure.ts
          grep -q "verifyIdToken" server.secure.ts
          grep -q "requireFirebaseUser" server.secure.ts
          grep -q "requireActiveEmployee" server.secure.ts
          grep -q "FIRESTORE_SYNC_READ_FAILED" server.secure.ts
          grep -q "FIRESTORE_SYNC_WRITE_FAILED" server.secure.ts
          ! grep -q "res.json(cloudState)" server.secure.ts
          ! grep -q "let cloudState" server.secure.ts
          ! grep -q "signInAnonymously" src/services/firebase.ts

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "classes.dex"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DD-World-Enterprise-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
