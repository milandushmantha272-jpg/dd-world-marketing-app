name: Build Permanent Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dd-world-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify local TypeScript compiler
        run: |
          test -x ./node_modules/.bin/tsc
          ./node_modules/.bin/tsc --version

      - name: TypeScript Check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Production Server Security Guard
        run: |
          test -s server.secure.ts
          grep -q "verifyIdToken" server.secure.ts
          grep -q "requireFirebaseUser" server.secure.ts
          grep -q "requireActiveEmployee" server.secure.ts
          grep -q "FIRESTORE_SYNC_READ_FAILED" server.secure.ts
          grep -q "FIRESTORE_SYNC_WRITE_FAILED" server.secure.ts
          ! grep -q "res.json(cloudState)" server.secure.ts
          ! grep -q "let cloudState" server.secure.ts
          ! grep -q "signInAnonymously" src/services/firebase.ts

      - name: Verify Android Signing Certificate
        run: |
          set -euo pipefail
          test -s android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew signingReport --no-daemon | tee ../signing-report.txt
          echo "=== ACTUAL SIGNING CERTIFICATE FINGERPRINTS ==="
          awk '/Variant: debug/{flag=1} flag && /SHA1:/{print "SHA-1: "$2} flag && /SHA-256:/{print "SHA-256: "$2; flag=0}' ../signing-report.txt
          test -s ../signing-report.txt
          grep -Eiq 'SHA1:|SHA-1:' ../signing-report.txt
          grep -Eiq 'SHA-256:' ../signing-report.txt

      - name: Build Web Application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "classes.dex"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DD-World-Enterprise-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            signing-report.txt
          if-no-files-found: error
