name: Build Permanent Android APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Customer App Activation Controls
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, required=True):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  if required:
                      raise SystemExit(f'Expected pattern not found in {path}: {old[:120]!r}')
                  return s
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              return s

          # 1) ProductSale verification metadata.
          replace_once('src/types.ts',
              "  status?: 'COMPLETED' | 'PENDING' | 'CANCELLED' | string;\n  amount?: number;",
              "  status?: 'COMPLETED' | 'PENDING' | 'CANCELLED' | string;\n  verificationStatus?: 'PENDING' | 'VERIFIED' | 'REJECTED' | string;\n  verifiedAt?: string;\n  verifiedBy?: string;\n  verificationNote?: string;\n  amount?: number;")

          # 2) DataContext: allow a sale to be explicitly pending and return its ID.
          dc = Path('src/context/DataContext.tsx')
          s = dc.read_text(encoding='utf-8')
          old = "    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n  }) => void;\n  addIvrEntry:"
          new = "    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n    status?: ProductSale['status'];\n  }) => ProductSale;\n  updateProductSaleVerification: (saleId: string, status: 'COMPLETED' | 'PENDING' | 'CANCELLED', reviewedBy: string, note?: string) => boolean;\n  addIvrEntry:"
          if old not in s:
              raise SystemExit('DataContext interface addProductSale pattern not found')
          s = s.replace(old, new, 1)

          old = "    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n  }) => {\n    const agentUser = users.find("
          new = "    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n    status?: ProductSale['status'];\n  }): ProductSale => {\n    const agentUser = users.find("
          if old not in s:
              raise SystemExit('DataContext implementation addProductSale pattern not found')
          s = s.replace(old, new, 1)

          old = "      appShareChannel: saleData.appShareChannel,\n      status: 'COMPLETED',\n      notes: saleData.notes,"
          new = "      appShareChannel: saleData.appShareChannel,\n      status: saleData.status || 'COMPLETED',\n      verificationStatus: saleData.status === 'PENDING' ? 'PENDING' : 'VERIFIED',\n      verifiedAt: saleData.status === 'PENDING' ? undefined : new Date().toISOString(),\n      verifiedBy: saleData.status === 'PENDING' ? undefined : saleData.agentName,\n      notes: saleData.notes,"
          if old not in s:
              raise SystemExit('DataContext newSale status pattern not found')
          s = s.replace(old, new, 1)

          marker = "  const addIvrEntry = (entryData: {"
          if "const updateProductSaleVerification = (saleId: string" not in s:
              helper = """  const updateProductSaleVerification = (saleId: string, status: 'COMPLETED' | 'PENDING' | 'CANCELLED', reviewedBy: string, note?: string): boolean => {
            const existing = sales.find((sale) => sale.id === saleId);
            if (!existing) return false;
            const now = new Date().toISOString();
            const updatedSale: ProductSale = {
              ...existing,
              status,
              verificationStatus: status === 'COMPLETED' ? 'VERIFIED' : status === 'CANCELLED' ? 'REJECTED' : 'PENDING',
              verifiedAt: status === 'COMPLETED' || status === 'CANCELLED' ? now : undefined,
              verifiedBy: status === 'COMPLETED' || status === 'CANCELLED' ? reviewedBy : undefined,
              verificationNote: note,
            };
            setSales((prev) => {
              const updated = prev.map((sale) => sale.id === saleId ? updatedSale : sale);
              safeStorage.setItem(STORAGE_KEY_SALES, JSON.stringify(updated));
              return updated;
            });
            if (db) safeSetDoc(doc(db, 'sales', saleId), updatedSale, { merge: true }).catch(console.error);
            broadcastRealtimeEvent('UPDATE_SALE_VERIFICATION', updatedSale);
            return true;
          };

"""
              if marker not in s:
                  raise SystemExit('DataContext addIvrEntry marker not found')
              s = s.replace(marker, helper + marker, 1)

          # Return the created sale from addProductSale.
          old = "    );\n  };\n\n  const addIvrEntry = (entryData: {"
          new = "    );\n    return newSale;\n  };\n\n  const addIvrEntry = (entryData: {"
          if old not in s:
              raise SystemExit('DataContext addProductSale return marker not found')
          s = s.replace(old, new, 1)
          dc.write_text(s, encoding='utf-8')

          # 3) Customer App Activation: sharing is only a PENDING attempt. No customer PII is persisted.
          p = Path('src/components/sales/IvrKeypadAndAppShareModal.tsx')
          s = p.read_text(encoding='utf-8')
          s = replace_once(str(p),
              "  const { addProductSale, updateUserGps } = useData();",
              "  const { addProductSale, updateProductSaleVerification, updateUserGps } = useData();")
          s = replace_once(str(p),
              "  const [appShareSuccess, setAppShareSuccess] = useState<string | null>(null);",
              "  const [appShareSuccess, setAppShareSuccess] = useState<string | null>(null);\n  const [pendingAppSaleId, setPendingAppSaleId] = useState<string | null>(null);")
          s = p.read_text(encoding='utf-8')

          start = s.index("  const logAppActivationSale = ")
          end = s.index("  const handleShareWhatsApp = ", start)
          new_fn = """  const logAppActivationSale = (shareChannel: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT') => {
    const productType = selectedApp === 'govimithuru' ? 'ගොවිමිතුරු' : 'සයුරු';
    const productName = `${getAppName()} [Play Store Share]`;
    const lat = currentUser.location?.latitude || 6.9271;
    const lng = currentUser.location?.longitude || 79.8612;
    const district = currentUser.location?.district || currentUser.assignedDistrict || 'Colombo';
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    // The customer number/name is used only in this component for the current share action.
    // It is deliberately NOT written to the sale record or local storage.
    const pendingSale = addProductSale({
      agentId: currentUser.id,
      agentName: currentUser.name,
      agentCode: currentUser.agentCode || 'AG-000',
      teamId: currentUser.teamId || 'team-1',
      productType,
      productName,
      channel: 'APP',
      quantity: 1,
      customerName: undefined,
      customerMobile: undefined,
      amount: 0,
      notes: `Play Store App Share (${shareChannel}) - Pending customer installation/activation confirmation.`,
      location: `${district} (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
      latitude: lat,
      longitude: lng,
      district,
      time: timeStr,
      activationMethod: 'APP_LINK_SHARE',
      appShareChannel: shareChannel,
      status: 'PENDING',
    });

    setPendingAppSaleId(pendingSale.id);
    setAppCustomerPhone('');
    setAppCustomerName('');
    setAppShareSuccess(
      `⏳ ${getAppName()} Link යවා ඇත. Sale එක තවම Count නොවේ. Customer App එක Install/Activate කළ පසු Confirm කරන්න.`
    );
    setTimeout(() => setAppShareSuccess(null), 6000);
  };

  const confirmAppActivation = () => {
    if (!pendingAppSaleId) {
      alert('පළමුව Customer App Link එක Share කරන්න.');
      return;
    }
    const ok = updateProductSaleVerification(
      pendingAppSaleId,
      'COMPLETED',
      currentUser.name,
      `Customer confirmed ${getAppName()} installed/activated.`
    );
    if (ok) {
      setPendingAppSaleId(null);
      setAppShareSuccess('✅ Customer App activation තහවුරු විය. Sale එක දැන් Count වේ.');
      setTimeout(() => setAppShareSuccess(null), 5000);
    }
  };

"""
          s = s[:start] + new_fn + s[end:]
          s = s.replace("    logAppActivationSale('DIRECT');\n  };", "    // Copying a link is not a sale and does not create a pending record.\n  };")
          old = "            <button\n              type=\"button\"\n              onClick={() => logAppActivationSale('DIRECT')}\n              className=\"w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition flex items-center justify-center gap-2 border border-slate-700\"\n            >\n              <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n              <span>පාරිභෝගික දුරකථනයට Download කළ පසු Sale එක Count කරන්න</span>\n            </button>"
          new = "            <button\n              type=\"button\"\n              onClick={confirmAppActivation}\n              disabled={!pendingAppSaleId}\n              className=\"w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 font-bold text-xs transition flex items-center justify-center gap-2 border border-slate-700\"\n            >\n              <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n              <span>{pendingAppSaleId ? 'Customer App Install / Activation OK — Sale Count කරන්න' : 'පළමුව App Link Share කරන්න'}</span>\n            </button>"
          if old not in s:
              raise SystemExit('Customer App manual count button not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Keep the two official Play Store destinations in one place and never persist customer numbers.
          print('Customer App Activation migration applied successfully.')
          PY

      - name: Commit migrated source files
        shell: bash
        run: |
          git config user.name "DD World Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/types.ts src/context/DataContext.tsx src/components/sales/IvrKeypadAndAppShareModal.tsx
          if git diff --cached --quiet; then
            echo "No migration changes needed."
          else
            git commit -m "feat: separate app activation pending sales from customer PII"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Absolute APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DD-World-Enterprise-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
