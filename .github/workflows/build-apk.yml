name: Build Permanent Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package DD World Enterprise APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: 🛡️ Auto-Align Package Name with Firebase Console
        run: |
          # 1. Firebase එකේ ඇති com.ddworld.marketing.app නමට අනුව AndroidManifest.xml ස්වයංක්‍රීයවම නැවත ලිවීම
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              package="com.ddworld.marketing.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|layoutDirection|fontScale|screenLayout|density|smallestScreenSize"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBar"
                      android:launchMode="singleTop"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 2. build.gradle ගොනුවේ ඇති පැරණි namespace සහ applicationId ස්වයංක්‍රීයවම වෙනස් කිරීම
          sed -i 's/namespace ".*"/namespace "com.ddworld.marketing.app"/g' android/app/build.gradle
          sed -i 's/applicationId ".*"/applicationId "com.ddworld.marketing.app"/g' android/app/build.gradle

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Create Default Debug Keystore in Exact Config Path
        run: |
          mkdir -p /home/runner/.config/.android
          keytool -genkey -v -keystore /home/runner/.config/.android/debug.keystore -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp /home/runner/.config/.android/debug.keystore ~/.android/debug.keystore
          mkdir -p android/app
          cp /home/runner/.config/.android/debug.keystore android/app/debug.keystore
          echo "Keystore successfully placed in the exact config directory."

      - name: Generate Signing Report
        working-directory: ./android
        run: ./gradlew signingReport

      - name: Build Standalone Android APK
        working-directory: ./android
        run: ./gradlew app:assembleDebug -x checkDebugAarMetadata -x checkReleaseAarMetadata --no-daemon --stacktrace

      - name: Prepare APK for Direct Download
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/DD-World-Enterprise.apk \;
          ls -lh dist-apk/
          echo "APK successfully prepared at dist-apk/DD-World-Enterprise.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DD-World-Enterprise-APK
          path: dist-apk/DD-World-Enterprise.apk
          retention-days: 90
