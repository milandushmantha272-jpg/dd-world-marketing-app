name: Build Permanent Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dd-world-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify local TypeScript compiler
        run: |
          test -x ./node_modules/.bin/tsc
          ./node_modules/.bin/tsc --version

      - name: TypeScript Check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Production Server Security Guard
        run: |
          test -s server.secure.ts
          grep -q "verifyIdToken" server.secure.ts
          grep -q "requireFirebaseUser" server.secure.ts
          grep -q "requireActiveEmployee" server.secure.ts
          grep -q "FIRESTORE_SYNC_READ_FAILED" server.secure.ts
          grep -q "FIRESTORE_SYNC_WRITE_FAILED" server.secure.ts
          ! grep -q "res.json(cloudState)" server.secure.ts
          ! grep -q "let cloudState" server.secure.ts
          ! grep -q "signInAnonymously" src/services/firebase.ts

      - name: Build Web Application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Extract Actual Signing Certificate Fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-certificate.txt

          # apksigner output can contain variable whitespace and formatting.
          # Normalize whitespace before extracting the two required digests.
          SHA1="$(sed -n 's/^[[:space:]]*Signer #1 certificate SHA-1 digest:[[:space:]]*//p' signing-certificate.txt | head -n 1 | tr -d '[:space:]')"
          SHA256="$(sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' signing-certificate.txt | head -n 1 | tr -d '[:space:]')"

          # Fail clearly if apksigner did not expose both fingerprints.
          [[ "$SHA1" =~ ^([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2}$ ]]
          [[ "$SHA256" =~ ^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$ ]]

          printf 'SHA-1: %s\nSHA-256: %s\n' "$SHA1" "$SHA256" | tee signing-fingerprints.txt

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          test -s signing-fingerprints.txt
          grep -Eq '^SHA-1: ([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2}$' signing-fingerprints.txt
          grep -Eq '^SHA-256: ([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$' signing-fingerprints.txt
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "classes.dex"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DD-World-Enterprise-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            signing-certificate.txt
            signing-fingerprints.txt
          if-no-files-found: error
