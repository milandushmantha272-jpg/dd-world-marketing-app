name: Build Permanent Android APKon:push:branches: [ main, master ]workflow_dispatch:permissions:contents: writejobs:build-apk:name: Build & Package DD World Enterprise APKruns-on: ubuntu-lateststeps:- name: Checkout Codeuses: actions/checkout@v4- name: Setup Node.js 22 (LTS)uses: actions/setup-node@v4with:node-version: 22- name: Setup Java 21 (JDK)uses: actions/setup-java@v4with:distribution: 'temurin'java-version: '21'- name: Setup Android SDKuses: android-actions/setup-android@v3with:packages: "platforms;android-35 build-tools;35.0.0 platform-tools"- name: Install Dependenciesrun: |npm install --legacy-peer-depsnpm install react-is --legacy-peer-deps- name: Build Web Applicationrun: npm run build- name: Sync Capacitor Android Assetsrun: npx cap sync android- name: Make Gradle Executableworking-directory: ./androidrun: chmod +x gradlew- name: Accept Android Licensesrun: yes | sdkmanager --licenses- name: Generate Signing Reportrun: |cd android./gradlew signingReport- name: Build Standalone Android APKworking-directory: ./androidrun: ./gradlew app:assembleDebug -x checkDebugAarMetadata -x checkReleaseAarMetadata --no-daemon --stacktrace- name: Prepare APK for Direct Downloadrun: |mkdir -p dist-apkfind android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/DD-World-Enterprise.apk ;ls -lh dist-apk/echo "APK successfully prepared at dist-apk/DD-World-Enterprise.apk"- name: Upload APK Artifactuses: actions/upload-artifact@v4with:name: DD-World-Enterprise-APKpath: : 90
