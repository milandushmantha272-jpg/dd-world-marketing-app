name: Security Hardening Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production authentication hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          login = Path('src/components/LoginModal.tsx')
          s = login.read_text(encoding='utf-8')

          # Remove local password/PIN authentication and require AuthContext/Firebase Auth.
          s = re.sub(
              r"  const handleSelectUser = \(userId: string\) => \{.*?^  \};",
              '''  const handleSelectUser = (userId: string) => {
            setError('');
            setFraudAlert(null);
            const target = users.find((u) => u.id === userId);
            if (!target) return;
            if (target.employmentStatus === 'BLOCKED' || target.employmentStatus === 'SUSPENDED' || target.employmentStatus === 'EXITED' || target.status === 'blocked') {
              setError(`🚫 ${target.name}: account is blocked/suspended/exited. Login denied.`);
              return;
            }
            setAgentCode(target.agentCode || target.employeeId || target.email || target.id);
            setPasswordInput('');
            safeStorage.setItem('ddworld_last_bio_user_id', userId);
            setError(`🔐 ${target.name}: Firebase Password එක ඇතුළත් කර Login කරන්න.`);
          };''', s, count=1, flags=re.S | re.M)

          s = s.replace('  const handleManualLogin = (e: React.FormEvent) => {', '  const handleManualLogin = async (e: React.FormEvent) => {', 1)
          s, n = re.subn(
              r"    // Check password if set by owner\n    const requiredPass =.*?^    safeStorage\.setItem\('ddworld_last_bio_user_id', found\.id\);\n    login\(found\.id\);",
              '''    if (!passwordInput || !passwordInput.trim()) {
      setError(`කරුණාකර ${found.name} සඳහා Firebase Password එක ඇතුළත් කරන්න.`);
      return;
    }
    try {
      safeStorage.setItem('ddworld_last_bio_user_id', found.id);
      await login(found.id, passwordInput.trim());
    } catch (err: any) {
      setError(err?.message || 'Firebase authentication අසාර්ථකයි.');
    }''', s, count=1, flags=re.S | re.M)
          if n != 1:
              raise SystemExit('manual credential block not found')

          s, n = re.subn(
              r"      // Find candidate user.*?      // Biometric scan latency simulation\n      await new Promise\(\(resolve\) => setTimeout\(resolve, 900\)\);\n\n      setBioSuccess\(true\);\n      setTimeout\(\(\) => \{\n        setIsBioScanning\(false\);\n        setBioSuccess\(false\);\n        login\(candidateUser\.id\);\n      \}, 650\);",
              "      setIsBioScanning(false);\n      throw new Error('Biometric/FIDO2 secure enrollment තවම සම්පූර්ණ කර නැත. Password Login භාවිතා කරන්න.');",
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('biometric simulation block not found')

          s = s.replace('FIDO2 / Biometric Ready', 'Secure Login Required')
          s = s.replace('Biometric: සක්‍රීයයි (Ready)', 'Secure Auth: සක්‍රීයයි')
          login.write_text(s, encoding='utf-8')

          rules = Path('firestore.rules')
          r = rules.read_text(encoding='utf-8')
          helper = '''    function isActiveEmployee() {
      let userData = getUserData();
      return userData.status == 'active' &&
             userData.employmentStatus == 'ACTIVE' &&
             userData.idApprovalStatus != 'REJECTED';
    }

'''
          if 'function isActiveEmployee()' not in r:
              anchor = '    /**\n     * Check if user is system owner/admin\n     */\n'
              if anchor not in r:
                  raise SystemExit('Firestore owner helper anchor not found')
              r = r.replace(anchor, helper + anchor, 1)
          r = re.sub(r'(allow create: if isAuthorized\(\) &&\s*isSignedIn\(\) &&\s*)', r'\1isActiveEmployee() &&\n                       ', r, count=1)
          rules.write_text(r, encoding='utf-8')

      - name: Verify hardening
        shell: bash
        run: |
          ! grep -q "passwordInput.trim() !== requiredPass.trim()" src/components/LoginModal.tsx
          ! grep -q "Biometric scan latency simulation" src/components/LoginModal.tsx
          grep -q "await login(found.id, passwordInput.trim())" src/components/LoginModal.tsx
          grep -q "function isActiveEmployee()" firestore.rules

      - name: Commit safely on latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginModal.tsx firestore.rules
          if git diff --cached --quiet; then
            echo "No hardening changes needed"
            exit 0
          fi
          git commit -m "security: enforce Firebase authentication and active-user access"
          git pull --rebase origin main
          git push origin HEAD:main
