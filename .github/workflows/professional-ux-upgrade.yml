name: Professional UX Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'feat: apply professional UX upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production UX and data-safety upgrades
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Remove known fake/demo identity and location fallbacks from runtime source.
          replacements = {
              "'199518294021'": "''",
              '"199518294021"': '""',
              "'951829402V'": "''",
              '"951829402V"': '""',
              "'No. 124, Kandy Road, Kadawatha, Sri Lanka'": "''",
              '"No. 124, Kandy Road, Kadawatha, Sri Lanka"': '""',
              "'Sri Lanka'": "''",
              "'Colombo, Sri Lanka'": "''",
              "'Grama_Niladhari_Report_Dammika_9291.pdf (Verified)'": "''",
              "'Police_Clearance_Dammika_9291.pdf (Verified)'": "''",
              "'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&auto=format&fit=crop&q=80'": "''",
          }
          for p in root.glob('src/**/*.tsx'):
              s = p.read_text(encoding='utf-8')
              ns = s
              for a,b in replacements.items(): ns = ns.replace(a,b)
              if ns != s: p.write_text(ns, encoding='utf-8')
          p = root/'src/data/initialData.ts'
          if p.exists():
              s=p.read_text(encoding='utf-8'); ns=s
              for a,b in replacements.items(): ns=ns.replace(a,b)
              if ns!=s: p.write_text(ns,encoding='utf-8')

          # Make the signed-in identity permanently visible in the corporate header.
          p = root/'src/components/Navbar.tsx'
          s = p.read_text(encoding='utf-8')
          old = '''          <div className="hidden md:flex items-center gap-3">\n            {getRoleBadge()}\n          </div>'''
          new = '''          <div className="hidden md:flex items-center gap-3">\n            <div className="text-right leading-tight">\n              <div className="text-[11px] font-black text-white truncate max-w-[180px]">{currentUser.name}</div>\n              <div className="text-[9px] text-slate-500 font-mono">{currentUser.employeeId || currentUser.agentCode || currentUser.id}</div>\n            </div>\n            {getRoleBadge()}\n          </div>'''
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')

          # Add a controlled Daily Top-3 achievement board. Owner must approve before publication.
          comp = root/'src/components/owner/pages/DailyAchievementBoard.tsx'
          comp.write_text(r'''import React, { useMemo, useState } from 'react';
import { Award, CheckCircle2, Lock, Trophy, Users } from 'lucide-react';
import { useData } from '../../../context/DataContext';
import { useAuth } from '../../../context/AuthContext';

export const DailyAchievementBoard: React.FC = () => {
  const { users, sales } = useData();
  const { currentUser } = useAuth();
  const today = new Date().toISOString().split('T')[0];
  const [approved, setApproved] = useState(false);

  const top3 = useMemo(() => {
    const totals = new Map<string, number>();
    sales.filter(s => s.date === today).forEach(s => {
      const id = s.agentId || s.userId || s.employeeId || '';
      if (!id) return;
      totals.set(id, (totals.get(id) || 0) + (s.quantity || 1));
    });
    return [...totals.entries()].map(([id, total]) => ({
      user: users.find(u => u.id === id || u.agentCode === id || u.employeeId === id), total
    })).filter(x => x.user).sort((a,b) => b.total-a.total).slice(0,3);
  }, [sales, users, today]);

  const isOwner = currentUser?.role === 'owner';
  return <section className="p-6 rounded-3xl bg-slate-900 border border-amber-500/20 shadow-xl space-y-5">
    <div className="flex items-center justify-between gap-4">
      <div className="flex items-center gap-3">
        <div className="p-3 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-300"><Trophy className="w-6 h-6" /></div>
        <div><h3 className="text-lg font-black text-white">Daily Best Sales — Top 3</h3><p className="text-xs text-slate-400">Daily Final Report මත පදනම් වූ ranking එක • {today}</p></div>
      </div>
      <span className={`px-3 py-1.5 rounded-full text-[10px] font-black border ${approved ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/10 text-amber-300 border-amber-500/30'}`}>
        {approved ? 'OWNER APPROVED • PUBLISHED' : 'PENDING OWNER APPROVAL'}
      </span>
    </div>
    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
      {top3.length ? top3.map((x,i)=><div key={x.user!.id} className="rounded-2xl bg-slate-950 border border-slate-800 p-4 flex items-center gap-3">
        <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center font-black text-amber-300">#{i+1}</div>
        <div className="min-w-0"><div className="font-black text-white truncate">{x.user!.name}</div><div className="text-[10px] text-slate-500">{x.user!.agentCode || x.user!.employeeId || 'ID pending'} • {x.total} verified units</div></div>
      </div>) : <div className="md:col-span-3 p-5 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-slate-400 flex items-center gap-2"><Users className="w-4 h-4" />No final sales recorded for today yet.</div>}
    </div>
    {isOwner ? <button onClick={()=>setApproved(true)} disabled={approved || top3.length===0} className="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-black text-xs flex items-center justify-center gap-2"><CheckCircle2 className="w-4 h-4" />{approved ? 'Published to Company' : 'Owner Check & Approve Daily Final Report'}</button> : <div className="text-[10px] text-slate-500 flex items-center gap-2"><Lock className="w-3.5 h-3.5" />Top 3 becomes public only after Owner approval.</div>}
  </section>;
};
''',encoding='utf-8')

          # Integrate the board into Owner executive summaries.
          p = root/'src/components/owner/pages/ExecutiveSummariesPage.tsx'
          s=p.read_text(encoding='utf-8')
          if "DailyAchievementBoard" not in s:
              s=s.replace("import { useData } from '../../../context/DataContext';", "import { useData } from '../../../context/DataContext';\nimport { DailyAchievementBoard } from './DailyAchievementBoard';")
              marker='''      {/* Target vs Achievement Banner Card */}'''
              s=s.replace(marker, '''      <DailyAchievementBoard />\n\n      {/* Target vs Achievement Banner Card */}''',1)
              p.write_text(s,encoding='utf-8')

          print('Professional UX upgrade applied')
          PY
      - name: Validate TypeScript build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then echo "No source changes"; exit 0; fi
          git commit -m "feat: apply professional UX upgrade"
          git push
