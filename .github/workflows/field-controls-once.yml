name: Field Activation Migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/migrate_field_activation.py

      - name: Commit migration and remove runner
        run: |
          git config user.name "DD World Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/types.ts src/context/DataContext.tsx src/components/sales/IvrKeypadAndAppShareModal.tsx
          git rm scripts/migrate_field_activation.py .github/workflows/field-controls-once.yml
          git commit -m "feat: separate app activation pending sales from customer PII"
          git push
