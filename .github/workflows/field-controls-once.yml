name: One-time Field Sales Control Migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply field sales controls
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  return False
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              return True

          # ProductSale: explicit verification metadata.
          replace_once('src/types.ts',
              "  status?: 'COMPLETED' | 'PENDING' | 'CANCELLED' | string;\n  amount?: number;",
              "  status?: 'COMPLETED' | 'PENDING' | 'CANCELLED' | string;\n  verificationStatus?: 'PENDING' | 'VERIFIED' | 'REJECTED' | string;\n  verifiedAt?: string;\n  verifiedBy?: string;\n  verificationNote?: string;\n  amount?: number;")

          # DataContext addProductSale accepts an explicit pending/completed state and returns the created sale.
          dc = Path('src/context/DataContext.tsx')
          s = dc.read_text(encoding='utf-8')
          s = s.replace("    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n  }) => void;\n  addIvrEntry:",
                        "    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n    status?: ProductSale['status'];\n  }) => ProductSale;\n  updateProductSaleVerification: (saleId: string, status: 'COMPLETED' | 'PENDING' | 'CANCELLED', reviewedBy: string, note?: string) => boolean;\n  addIvrEntry:", 1)
          s = s.replace("    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n  }) => {\n    const agentUser = users.find(",
                        "    appShareChannel?: 'WHATSAPP' | 'SMS' | 'QR' | 'DIRECT';\n    status?: ProductSale['status'];\n  }): ProductSale => {\n    const agentUser = users.find(", 1)
          s = s.replace("      appShareChannel: saleData.appShareChannel,\n      status: 'COMPLETED',\n      notes: saleData.notes,",
                        "      appShareChannel: saleData.appShareChannel,\n      status: saleData.status || 'COMPLETED',\n      verificationStatus: saleData.status === 'PENDING' ? 'PENDING' : 'VERIFIED',\n      verifiedAt: saleData.status === 'PENDING' ? undefined : new Date().toISOString(),\n      verifiedBy: saleData.status === 'PENDING' ? undefined : saleData.agentName,\n      notes: saleData.notes,")
          s = s.replace("    broadcastRealtimeEvent('ADD_SALE', newSale);\n\n    // Notify Owner and Team Leader in real-time",
                        "    broadcastRealtimeEvent('ADD_SALE', newSale);\n\n    // Return the ID so field activation flows can keep a short-lived in-memory pending session.\n    // Customer phone/name are never required for that pending record.\n    // Notify Owner and Team Leader in real-time", 1)
          # Insert return after the sale alert block, immediately before addIvrEntry.
          marker = "  const addIvrEntry = (entryData: {"
          insert = """  const updateProductSaleVerification = (saleId: string, status: 'COMPLETED' | 'PENDING' | 'CANCELLED', reviewedBy: string, note?: string): boolean => {
            const existing = sales.find((sale) => sale.id === saleId);
            if (!existing) return false;
            const now = new Date().toISOString();
            const updatedSale: ProductSale = {
              ...existing,
              status,
              verificationStatus: status === 'COMPLETED' ? 'VERIFIED' : status === 'CANCELLED' ? 'REJECTED' : 'PENDING',
              verifiedAt: status === 'COMPLETED' || status === 'CANCELLED' ? now : undefined,
              verifiedBy: status === 'COMPLETED' || status === 'CANCELLED' ? reviewedBy : undefined,
              verificationNote: note,
            };
            setSales((prev) => {
              const updated = prev.map((sale) => sale.id === saleId ? updatedSale : sale);
              safeStorage.setItem(STORAGE_KEY_SALES, JSON.stringify(updated));
              return updated;
            });
            if (db) safeSetDoc(doc(db, 'sales', saleId), updatedSale, { merge: true }).catch(console.error);
            broadcastRealtimeEvent('UPDATE_SALE_VERIFICATION', updatedSale);
            return true;
          };

"""
          if marker in s and 'const updateProductSaleVerification = ' not in s:
              s = s.replace(marker, insert + marker, 1)
          # Return the newly created sale before the function closes.
          alert_marker = "    window.dispatchEvent(\n      new CustomEvent('ddworld_sale_alert', {"
          # The easiest stable insertion point is the closing of the alert dispatch immediately before addIvrEntry.
          pattern = r"(      })\n    \);\n  };\n\n)(  const addIvrEntry = \(entryData: \{)"
          s, n = re.subn(pattern, r"\1    return newSale;\n  };\n\n\2", s, count=1)
          dc.write_text(s, encoding='utf-8')

          # Customer App Activation: share creates PENDING only; explicit customer-install confirmation completes it.
          p = Path('src/components/sales/IvrKeypadAndAppShareModal.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  const { addProductSale, updateUserGps } = useData();",
                        "  const { addProductSale, updateProductSaleVerification, updateUserGps } = useData();", 1)
          s = s.replace("  const [appShareSuccess, setAppShareSuccess] = useState<string | null>(null);",
                        "  const [appShareSuccess, setAppShareSuccess] = useState<string | null>(null);\n  const [pendingAppSaleId, setPendingAppSaleId] = useState<string | null>(null);", 1)
          # App sale: remove customer PII and mark pending.
          s = s.replace("      customerName: appCustomerName.trim() || undefined,\n      customerMobile: appCustomerPhone.trim() || undefined,",
                        "      // Customer phone/name are intentionally NOT persisted in the sales record.\n      // They exist only in component memory for the current share action.\n      customerName: undefined,\n      customerMobile: undefined,", 1)
          s = s.replace("      appShareChannel: shareChannel,\n    });\n\n    setAppShareSuccess(\n      `✅ ${getAppName()} Link එක සාර්ථකව පාරිභෝගිකයාට යවන ලදී!\\nSale එක සටහන් විය | නියෝජිත: ${currentUser.name} | දිස්ත්‍රික්කය: ${district}`\n    );",
                        "      appShareChannel: shareChannel,\n      status: 'PENDING',\n      notes: `APP LINK SHARE (${shareChannel}) - Pending customer installation confirmation.`,\n    });\n\n    const pendingSale = addProductSale({\n      agentId: currentUser.id,\n      agentName: currentUser.name,\n      agentCode: currentUser.agentCode || 'AG-000',\n      teamId: currentUser.teamId || 'team-1',\n      productType,\n      productName,\n      channel: 'APP',\n      quantity: 1,\n      customerName: undefined,\n      customerMobile: undefined,\n      amount: 0,\n      location: `${district} (${lat.toFixed(4)}, ${lng.toFixed(4)})`,\n      latitude: lat,\n      longitude: lng,\n      district,\n      time: timeStr,\n      activationMethod: 'APP_LINK_SHARE',\n      appShareChannel: shareChannel,\n      status: 'PENDING',\n      notes: `APP LINK SHARE (${shareChannel}) - Pending customer installation confirmation.`,\n    });\n    setPendingAppSaleId(pendingSale.id);\n    setAppCustomerPhone('');\n    setAppCustomerName('');\n    setAppShareSuccess(\n      `⏳ ${getAppName()} Link යවා ඇත. Sale එක තවම Count නොවේ. Customer App එක Install/Activate කළ පසු පහත Confirm කරන්න.`\n    );")
          # The replacement above duplicates the original addProductSale call. Remove the first call block if present by targeting the old block from addProductSale to closing.
          duplicate = re.compile(r"\n    addProductSale\(\{\n      agentId: currentUser\.id,\n      agentName: currentUser\.name,\n      agentCode: currentUser\.agentCode \|\| 'AG-000',\n      teamId: currentUser\.teamId \|\| 'team-1',\n      productType,\n      productName,\n      channel: 'APP',\n      quantity: 1,\n      // Customer phone/name are intentionally NOT persisted in the sales record\.[\s\S]*?      notes: `APP LINK SHARE \(\$\{shareChannel\}\) - Pending customer installation confirmation\.`,\n    \}\);\n\n    const pendingSale = addProductSale\(", re.M)
          # If the duplicate pattern is matched, keep only the pending call.
          s = duplicate.sub("\n    const pendingSale = addProductSale(", s, count=1)
          # Add confirmation helper before WhatsApp handler.
          marker2 = "  const handleShareWhatsApp = () => {"
          helper = """  const confirmAppActivation = () => {
    if (!pendingAppSaleId) {
      alert('පළමුව Customer App Link එක Share කරන්න.');
      return;
    }
    const ok = updateProductSaleVerification(
      pendingAppSaleId,
      'COMPLETED',
      currentUser.name,
      `Customer confirmed ${getAppName()} installed/activated.`
    );
    if (ok) {
      setPendingAppSaleId(null);
      setAppShareSuccess(`✅ Customer App activation තහවුරු විය. Sale එක දැන් Count වේ.`);
      setTimeout(() => setAppShareSuccess(null), 5000);
    }
  };

"""
          if marker2 in s and 'const confirmAppActivation' not in s:
              s = s.replace(marker2, helper + marker2, 1)
          # Replace old manual-count button with confirmation button.
          s = s.replace("<span>පාරිභෝගික දුරකථනයට Download කළ පසු Sale එක Count කරන්න</span>",
                        "<span>{pendingAppSaleId ? 'Customer App Install / Activation OK — Sale Count කරන්න' : 'පළමුව App Link Share කරන්න'}</span>", 1)
          s = s.replace("            >\n              <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n              <span>{pendingAppSaleId ? 'Customer App Install / Activation OK — Sale Count කරන්න' : 'පළමුව App Link Share කරන්න'}</span>\n            </button>",
                        "            >\n              <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n              <span>{pendingAppSaleId ? 'Customer App Install / Activation OK — Sale Count කරන්න' : 'පළමුව App Link Share කරන්න'}</span>\n            </button>", 1)
          # Ensure button actually invokes confirmation and is disabled without a pending sale.
          s = s.replace("            onClick={() => logAppActivationSale('DIRECT')}", "            onClick={confirmAppActivation}\n              disabled={!pendingAppSaleId}", 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit migrated source files
        shell: bash
        run: |
          git config user.name "DD World Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/types.ts src/context/DataContext.tsx src/components/sales/IvrKeypadAndAppShareModal.tsx
          if git diff --cached --quiet; then
            echo "No source migration changes needed."
          else
            git commit -m "feat: separate app activation pending sales from customer PII"
            git push
          fi

      - name: Remove one-time migration workflow
        shell: bash
        run: |
          git rm .github/workflows/field-controls-once.yml || true
          git config user.name "DD World Automation"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove one-time field controls migration"
          git push
