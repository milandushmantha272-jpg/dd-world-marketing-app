name: Restore Types File

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore types.ts from verified migration commit
        run: |
          git checkout b03d1f6eeda3fecfc31c58d60d72054f26b9c587 -- src/types.ts
          git config user.name "DD World Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/types.ts
          git commit -m "fix: restore complete shared type definitions"
          git push
      - name: Remove restore runner
        run: |
          git rm .github/workflows/restore-types-once.yml
          git config user.name "DD World Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: remove emergency types restore runner"
          git push
