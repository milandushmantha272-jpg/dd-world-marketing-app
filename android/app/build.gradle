apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def ddWorldAppId = (project.findProperty('ddWorldAppId') ?: 'com.ddworld.marketing.app').toString()

if (!(ddWorldAppId ==~ /com\\.ddworld\\.(agent|management|audit)\\.app/) && ddWorldAppId != 'com.ddworld.marketing.app') {
    throw new GradleException('Unsupported DD WORLD applicationId: ' + ddWorldAppId)
}

android {
    namespace ddWorldAppId
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId ddWorldAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "com.google.android.gms:play-services-location:21.1.0"
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.0"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

tasks.whenTaskAdded { task ->
    if (task.name.toLowerCase().contains("aabmetadata")) {
        task.enabled = false
    }
}